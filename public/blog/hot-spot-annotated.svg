<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="hotspotTitle">
  <title id="hotspotTitle">Enhanced hot spot annotation example</title>
  <rect width="800" height="460" fill="#faf9f6"/>
  <text x="400" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0b1b3d">Enhanced Hot Spot  Precision Over Guessing</text>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52607a">Read what to identify, then click the exact anatomic / image region</text>

  <!-- Torso outline simplified -->
  <ellipse cx="400" cy="250" rx="120" ry="150" fill="#fff" stroke="#0b1b3d" stroke-width="3"/>
  <!-- Head -->
  <circle cx="400" cy="90" r="28" fill="#fff" stroke="#0b1b3d" stroke-width="3"/>
  <!-- Arms hint -->
  <path d="M280 180 Q220 260 260 340" fill="none" stroke="#0b1b3d" stroke-width="3"/>
  <path d="M520 180 Q580 260 540 340" fill="none" stroke="#0b1b3d" stroke-width="3"/>

  <!-- Target zone (right lower lobe example - viewer's left is client's right) -->
  <circle cx="360" cy="280" r="28" fill="#e76f51" fill-opacity="0.35" stroke="#e76f51" stroke-width="3"/>
  <circle cx="360" cy="280" r="6" fill="#e76f51"/>

  <!-- Callout -->
  <rect x="520" y="240" width="220" height="80" rx="8" fill="#0b1b3d"/>
  <text x="630" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">Example target</text>
  <text x="630" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c5cedd">Auscultate right</text>
  <text x="630" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c5cedd">lower lobe</text>
  <path d="M520 280 L390 280" stroke="#e76f51" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e76f51"/>
    </marker>
  </defs>

  <rect x="80" y="400" width="640" height="40" rx="8" fill="#d1ebed"/>
  <text x="400" y="425" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0b1b3d">Tip: re-read laterality (left/right) and landmark before you click</text>
</svg>
