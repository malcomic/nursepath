<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="bowtieTitle">
  <title id="bowtieTitle">Bowtie item anatomy</title>
  <rect width="800" height="420" fill="#faf9f6"/>
  <text x="400" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0b1b3d">Bowtie Item Anatomy</text>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52607a">Match left and right sides to the same center priority</text>

  <!-- Left wing -->
  <path d="M60 210 L220 110 L220 310 Z" fill="#107c85"/>
  <text x="145" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">Actions</text>
  <text x="145" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">to Take</text>
  <text x="145" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#e8f5f6">Interventions</text>

  <!-- Center -->
  <ellipse cx="400" cy="210" rx="110" ry="90" fill="#0b1b3d"/>
  <text x="400" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">Potential</text>
  <text x="400" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">Condition</text>
  <text x="400" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c5cedd">Priority problem</text>

  <!-- Right wing -->
  <path d="M740 210 L580 110 L580 310 Z" fill="#e76f51"/>
  <text x="655" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">Parameters</text>
  <text x="655" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">to Monitor</text>
  <text x="655" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#fef4f1">Assessments / labs</text>

  <!-- Connectors -->
  <path d="M220 210 H290" stroke="#0b1b3d" stroke-width="3"/>
  <path d="M510 210 H580" stroke="#0b1b3d" stroke-width="3"/>

  <!-- Legend -->
  <rect x="100" y="350" width="600" height="48" rx="8" fill="#fff" stroke="#e6e9ee"/>
  <text x="400" y="379" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0b1b3d">Rule: Center first ’ then actions and monitors that address THAT problem</text>
</svg>
