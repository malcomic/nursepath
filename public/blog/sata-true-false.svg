<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="sataTitle">
  <title id="sataTitle">SATA true or false method</title>
  <rect width="800" height="480" fill="#faf9f6"/>
  <text x="400" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0b1b3d">SATA Strategy: True / False Each Option</text>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52607a">Never count answers  judge each line against the stem</text>

  <!-- Stem box -->
  <rect x="80" y="80" width="640" height="70" rx="10" fill="#0b1b3d"/>
  <text x="400" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">STEM: Which findings indicate fluid volume overload?</text>
  <text x="400" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c5cedd">Cover options ’ decide what yes must mean ’ then reveal</text>

  <!-- Options -->
  <g font-family="system-ui,sans-serif">
    <rect x="80" y="170" width="480" height="48" rx="8" fill="#fff" stroke="#e6e9ee"/>
    <text x="100" y="200" font-size="13" fill="#0b1b3d">A. Crackles in lung bases</text>
    <rect x="580" y="170" width="140" height="48" rx="8" fill="#107c85"/>
    <text x="650" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">TRUE</text>

    <rect x="80" y="230" width="480" height="48" rx="8" fill="#fff" stroke="#e6e9ee"/>
    <text x="100" y="260" font-size="13" fill="#0b1b3d">B. Flat neck veins when supine</text>
    <rect x="580" y="230" width="140" height="48" rx="8" fill="#e76f51"/>
    <text x="650" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">FALSE</text>

    <rect x="80" y="290" width="480" height="48" rx="8" fill="#fff" stroke="#e6e9ee"/>
    <text x="100" y="320" font-size="13" fill="#0b1b3d">C. +2 pitting edema in ankles</text>
    <rect x="580" y="290" width="140" height="48" rx="8" fill="#107c85"/>
    <text x="650" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">TRUE</text>

    <rect x="80" y="350" width="480" height="48" rx="8" fill="#fff" stroke="#e6e9ee"/>
    <text x="100" y="380" font-size="13" fill="#0b1b3d">D. Weight loss of 2 kg overnight</text>
    <rect x="580" y="350" width="140" height="48" rx="8" fill="#e76f51"/>
    <text x="650" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">FALSE</text>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#52607a">Select A and C  ignore how many true answers you expected</text>
</svg>
