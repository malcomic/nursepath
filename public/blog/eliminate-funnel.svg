<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="funnelTitle">
  <title id="funnelTitle">Wrong-answer elimination funnel</title>
  <rect width="800" height="460" fill="#faf9f6"/>
  <text x="400" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0b1b3d">Eliminate Wrong Answers  Funnel Method</text>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52607a">Narrow options using safety, stem intent, and clinical fit</text>

  <!-- Funnel layers -->
  <polygon points="150,90 650,90 600,160 200,160" fill="#0b1b3d"/>
  <text x="400" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">4 options ’ cut unsafe / out-of-scope / irrelevant</text>

  <polygon points="200,180 600,180 550,250 250,250" fill="#107c85"/>
  <text x="400" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">23 left ’ compare to stem verb &amp; priority</text>

  <polygon points="250,270 550,270 500,340 300,340" fill="#1e9ba5"/>
  <text x="400" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">2 left ’ pick most specific / most immediate</text>

  <polygon points="300,360 500,360 450,420 350,420" fill="#e76f51"/>
  <text x="400" y="398" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">1 best answer</text>
</svg>
