<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="insTitle">
  <title id="insTitle">Steps for giving a sliding scale insulin dose safely</title>
  <rect width="800" height="460" fill="#faf9f6"/>
  <text x="400" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0b1b3d">Sliding Scale Insulin: Safe Sequence</text>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52607a">Ranges and unit amounts always come from the clients own order</text>

  <g font-family="system-ui,sans-serif">
    <rect x="60" y="85" width="320" height="56" rx="10" fill="#0b1b3d"/>
    <text x="80" y="119" font-size="14" font-weight="700" fill="#fff">1. Check current blood glucose</text>

    <rect x="60" y="155" width="320" height="56" rx="10" fill="#107c85"/>
    <text x="80" y="189" font-size="14" font-weight="700" fill="#fff">2. Find the matching range</text>

    <rect x="60" y="225" width="320" height="56" rx="10" fill="#1e9ba5"/>
    <text x="80" y="259" font-size="14" font-weight="700" fill="#fff">3. Read the ordered units</text>

    <rect x="60" y="295" width="320" height="56" rx="10" fill="#e76f51"/>
    <text x="80" y="329" font-size="14" font-weight="700" fill="#fff">4. Independent double-check</text>

    <rect x="60" y="365" width="320" height="56" rx="10" fill="#0a4a50"/>
    <text x="80" y="399" font-size="14" font-weight="700" fill="#fff">5. Give with insulin syringe, document</text>

    <rect x="430" y="85" width="310" height="336" rx="12" fill="#fff" stroke="#e6e9ee"/>
    <text x="585" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1b3d">Reading the range</text>
    <text x="455" y="160" font-size="12" fill="#52607a">" Check whether boundaries are</text>
    <text x="467" y="178" font-size="12" fill="#52607a">inclusive (151200)</text>
    <text x="455" y="208" font-size="12" fill="#52607a">" A reading on a boundary belongs</text>
    <text x="467" y="226" font-size="12" fill="#52607a">to exactly one row</text>
    <text x="455" y="256" font-size="12" fill="#52607a">" Very low or very high readings</text>
    <text x="467" y="274" font-size="12" fill="#52607a">usually trigger a notify/protocol</text>
    <text x="467" y="292" font-size="12" fill="#52607a">instruction, not a dose</text>
    <text x="455" y="322" font-size="12" fill="#52607a">" Units are never converted to mL</text>
    <text x="455" y="352" font-size="12" fill="#52607a">" Recheck glucose per protocol</text>
    <text x="467" y="370" font-size="12" fill="#52607a">after a correction dose</text>
  </g>
</svg>
