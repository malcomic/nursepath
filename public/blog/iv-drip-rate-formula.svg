<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="dripTitle">
  <title id="dripTitle">Gravity IV drip rate formula with worked example</title>
  <rect width="800" height="440" fill="#faf9f6"/>
  <text x="400" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0b1b3d">Gravity Drip Rate (gtt/min)</text>

  <g font-family="system-ui,sans-serif">
    <rect x="100" y="60" width="600" height="110" rx="12" fill="#fff" stroke="#107c85" stroke-width="2"/>
    <text x="400" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1b3d">Volume (mL) � Drop factor (gtt/mL)</text>
    <line x1="200" y1="115" x2="600" y2="115" stroke="#0b1b3d" stroke-width="2"/>
    <text x="400" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1b3d">Time (minutes)</text>

    <text x="400" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#52607a">Worked example: 1,000 mL over 8 hr, drop factor 15 gtt/mL</text>

    <rect x="60" y="220" width="210" height="110" rx="10" fill="#0b1b3d"/>
    <text x="165" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#c5cedd">STEP 1 � convert time</text>
    <text x="165" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">8 hr � 60</text>
    <text x="165" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#47afb7">= 480 min</text>

    <rect x="295" y="220" width="210" height="110" rx="10" fill="#107c85"/>
    <text x="400" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#e8f5f6">STEP 2 � numerator</text>
    <text x="400" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1,000 � 15</text>
    <text x="400" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">= 15,000 gtt</text>

    <rect x="530" y="220" width="210" height="110" rx="10" fill="#e76f51"/>
    <text x="635" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#fef4f1">STEP 3 � divide</text>
    <text x="635" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">15,000 � 480</text>
    <text x="635" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">= 31.25 � 31</text>
  </g>

  <rect x="60" y="355" width="680" height="62" rx="10" fill="#d1ebed"/>
  <text x="400" y="381" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0b1b3d">Answer: 31 gtt/min (you cant count a fraction of a drop)</text>
  <text x="400" y="402" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52607a">On a pump instead: 1,000 mL � 8 hr = 125 mL/hr</text>
</svg>
