<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="bsaTitle">
  <title id="bsaTitle">BSA dosing with the Mosteller formula</title>
  <rect width="800" height="440" fill="#faf9f6"/>
  <text x="400" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0b1b3d">BSA Dosing with the Mosteller Formula</text>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52607a">Example: child 100 cm tall, 16 kg � Order: 50 mg/m�</text>

  <g font-family="system-ui,sans-serif">
    <rect x="130" y="80" width="540" height="90" rx="12" fill="#fff" stroke="#107c85" stroke-width="2"/>
    <text x="270" y="133" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1b3d">BSA (m�) =</text>
    <text x="370" y="133" font-size="40" fill="#107c85"></text>
    <text x="510" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1b3d">height (cm) � weight (kg)</text>
    <line x1="400" y1="125" x2="620" y2="125" stroke="#0b1b3d" stroke-width="2"/>
    <text x="510" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1b3d">3,600</text>

    <rect x="40" y="200" width="230" height="110" rx="10" fill="#0b1b3d"/>
    <text x="155" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#c5cedd">1 � MULTIPLY</text>
    <text x="155" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">100 � 16 = 1,600</text>
    <text x="155" y="290" text-anchor="middle" font-size="12" fill="#c5cedd">� 3,600 = 0.4444</text>

    <rect x="285" y="200" width="230" height="110" rx="10" fill="#107c85"/>
    <text x="400" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#e8f5f6">2 � SQUARE ROOT</text>
    <text x="400" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">0.4444 = 0.6667</text>
    <text x="400" y="290" text-anchor="middle" font-size="12" fill="#e8f5f6">H 0.67 m� (dont round yet)</text>

    <rect x="530" y="200" width="230" height="110" rx="10" fill="#e76f51"/>
    <text x="645" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#fef4f1">3 � DOSE</text>
    <text x="645" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">50 � 0.6667</text>
    <text x="645" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">= 33.3 mg</text>
  </g>

  <rect x="40" y="335" width="720" height="80" rx="10" fill="#fde8e2"/>
  <text x="400" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0b1b3d">Rounding BSA to 0.67 first gives 33.5 mg, not 33.3 mg</text>
  <text x="400" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52607a">Carry full precision and round only the final answer, per your programs rules</text>
</svg>
